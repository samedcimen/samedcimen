      <rect x="150" y="159" width="34.8" height="8" rx="4" fill="#7c3aed" class="dolgu" />
      <text x="785" y="168" class="deger" text-anchor="end">35 dk · %7,2</text>
    </g>
    <g class="satir" style="animation-delay:510ms">
      <text x="25" y="202" class="dil">VBScript</text>
