<svg width="810" height="254" viewBox="0 0 810 254" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="baslik">
  <title id="baslik">Bu hafta kod yazarken: 8 sa 21 dk</title>
  <style>
    .baslik { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #7c3aed; }
    .ozet { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #434d58; }
    .aralik { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #6e7781; }
    .dil { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #434d58; }
    .deger { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #6e7781; }
    .satir { opacity: 0; animation: belir 0.4s ease-out forwards; }
    .dolgu { transform-box: fill-box; transform-origin: left; animation: uza 0.8s ease-out forwards; }
    @keyframes belir { to { opacity: 1; } }
    @keyframes uza { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <rect x="0.5" y="0.5" width="809" height="253" rx="4.5" fill="#fffefe" />
  <text x="25" y="35" class="baslik">Bu Hafta Kod Yazarken</text>
  <text x="25" y="62" class="ozet">Toplam: 8 sa 21 dk</text>
  <text x="785" y="62" class="aralik" text-anchor="end">13 Ekim – 19 Ekim</text>
  
    <g class="satir" style="animation-delay:150ms">
      <text x="25" y="100" class="dil">TypeScript</text>
      <rect x="150" y="91" width="485" height="8" rx="4" fill="#ddd" />
      <rect x="150" y="91" width="385.7" height="8" rx="4" fill="#3178c6" class="dolgu" />
      <text x="785" y="100" class="deger" text-anchor="end">6 sa 38 dk · %79,5</text>
    </g>
    <g class="satir" style="animation-delay:270ms">
      <text x="25" y="134" class="dil">Markdown</text>
