<svg width="810" height="186" viewBox="0 0 810 186" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="baslik">
  <title id="baslik">Bu hafta kod yazarken: 4 sa 32 dk</title>
  <style>
    .baslik { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b5cf6; }
    .ozet { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c3d1d9; }
    .aralik { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
    .dil { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c3d1d9; }
    .deger { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
    .satir { opacity: 0; animation: belir 0.4s ease-out forwards; }
    .dolgu { transform-box: fill-box; transform-origin: left; animation: uza 0.8s ease-out forwards; }
    @keyframes belir { to { opacity: 1; } }
    @keyframes uza { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <rect x="0.5" y="0.5" width="809" height="185" rx="4.5" fill="#0d1117" />
  <text x="25" y="35" class="baslik">Bu Hafta Kod Yazarken</text>
  <text x="25" y="62" class="ozet">Toplam: 4 sa 32 dk</text>
  <text x="785" y="62" class="aralik" text-anchor="end">17 Ekim – 23 Ekim</text>
  
    <g class="satir" style="animation-delay:150ms">
      <text x="25" y="100" class="dil">TypeScript</text>
      <rect x="150" y="91" width="485" height="8" rx="4" fill="#30363d" />
      <rect x="150" y="91" width="460.5" height="8" rx="4" fill="#3178c6" class="dolgu" />
      <text x="785" y="100" class="deger" text-anchor="end">4 sa 18 dk · %94,9</text>
    </g>
    <g class="satir" style="animation-delay:270ms">
      <text x="25" y="134" class="dil">Other</text>
      <rect x="150" y="125" width="485" height="8" rx="4" fill="#30363d" />
      <rect x="150" y="125" width="17.9" height="8" rx="4" fill="#8b5cf6" class="dolgu" />
      <text x="785" y="134" class="deger" text-anchor="end">10 dk · %3,7</text>
    </g>
    <g class="satir" style="animation-delay:390ms">
      <text x="25" y="168" class="dil">Text</text>
      <rect x="150" y="159" width="485" height="8" rx="4" fill="#30363d" />
      <rect x="150" y="159" width="6.6" height="8" rx="4" fill="#8b5cf6" class="dolgu" />
      <text x="785" y="168" class="deger" text-anchor="end">3 dk · %1,4</text>
    </g>
</svg>
