# GitHub istatistik ve dil kartlarını üretip profile/ klasörüne yazar.
# Private depolar da sayılsın diye STATS_TOKEN secret'ı (repo + read:user yetkili PAT)
# eklenirse onu kullanır; yoksa varsayılan anahtarla yalnızca public depolar sayılır.
name: Profil kartları

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/kartlar.yml"]

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORTAK: username=${{ github.repository_owner }}&hide_border=true&locale=tr
    steps:
      - uses: actions/checkout@v6

      - name: İstatistik kartı (koyu)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.ORTAK }}&show_icons=true&count_private=true&include_all_commits=true&theme=github_dark&bg_color=0d1117&title_color=8b5cf6&icon_color=8b5cf6
          path: profile/istatistik-koyu.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: İstatistik kartı (açık)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.ORTAK }}&show_icons=true&count_private=true&include_all_commits=true&title_color=7c3aed&icon_color=7c3aed
          path: profile/istatistik-acik.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Dil kartı (koyu)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.ORTAK }}&layout=compact&langs_count=8&theme=github_dark&bg_color=0d1117&title_color=8b5cf6
          path: profile/diller-koyu.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Dil kartı (açık)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.ORTAK }}&layout=compact&langs_count=8&title_color=7c3aed
          path: profile/diller-acik.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Kartları kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Profil kartlarını güncelle" || exit 0
          git push
